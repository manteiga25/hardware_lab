<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware Lab</title>
  <meta name="description" content="Especificações explicadas de processadores e placas gráficas, e comparação de desempenho e preço.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo" data-skip>Saltar para o conteúdo</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/cpu">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Hardware Lab</span>
      </a>
      <nav class="site-nav" aria-label="Principal">
        <a href="#/cpu" data-nav="cpu">Processadores</a>
        <a href="#/gpu" data-nav="gpu">Placas gráficas</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <!-- The processor and graphics card lists are built by js/views/list.js and inserted here. -->

    <!-- One product (filled by js/views/detail.js) -->
    <section class="view" data-view="detail" hidden></section>

    <!-- Two products side by side (filled by js/views/compare.js) -->
    <section class="view" data-view="compare" hidden></section>

  <footer class="site-footer">
    <div class="container">
      <p id="currency-note"></p>
      <p>As especificações vêm da base de dados do projeto e podem ter erros. Confirma no site do fabricante.</p>
    </div>
  </footer>

  <div class="tray" id="tray" hidden>
    <div class="container tray-inner">
      <ul class="tray-items" id="tray-items" aria-label="Escolhidos para comparar"></ul>
      <p class="tray-hint" id="tray-hint"></p>
      <button type="button" class="btn btn-primary" id="tray-compare">Comparar</button>
    </div>
  </div>
</body>
</html>
