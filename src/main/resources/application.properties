spring.application.name=app

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
spring.thymeleaf.cache=false

# Spring Configuration
spring.threads.virtual.enabled=true

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/spec
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:teste}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:granite4:3b}
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-ctx=8192

# API access
# Caps ?size= so a single request cannot dump the whole table.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
# Extra origins allowed to call /API/** (comma separated). Leave empty when the
# front-end is served by this application, which is the default setup.
app.cors.allowed-origins=
# There is no login, so Spring Boot must not create a default user with a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

